<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

    <!-- 1 -->
    <div class="container my-5">
        <div class="row g-4" id="bookSection"></div>
    </div>

    <!-- 2 -->
    <div class="container col-md-6 mt-5">
        <label class="form-label fw-bold">Press any key or click mouse inside the box</label>
        <input type="text" id="myInput" class="form-control" placeholder="Click here and type">
    </div>

    <!-- 3 -->
    <div class="container col-md-6 mt-4">
        <button id="startBtn" class="btn btn-primary mb-3">Start clock</button>
        <div id="clockDisplay" class="fs-2 fw-bold text-success"></div>
    </div>

    <!-- 5 -->
    
    <div class="d-flex justify-content-center align-items-center ">
        <input type="text" placeholder="Enter first name">
    </div>
    

    <script src="./script.js"></script>
