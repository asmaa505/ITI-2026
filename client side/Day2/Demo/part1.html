<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="test.html" method="get" autocomplete="on" novalidate>
        <!-- text -->
        <label for="test">Name:</label>
     <input autofocus="on" required autocomplete="off" id="test" type="text"  name="fullname" size="10" maxlength="5" placeholder="enter your name" > <br>
     <!-- password -->
      <label for="pass">password:</label>
     <input id="pass"  type="password" name="password"> <br>
        <input type="hidden" name="id" value="12345">
        <!-- text area -->
        <label for="comment">Comment:</label>
        <textarea id="comment" name="comment" rows="4" cols="9" maxlength="10"> 
        </textarea> <br>
        <!-- checkbox -->
         <input id="option1" type="checkbox" name="option1" value="option1"> <label for="option1">html</label> <br>
         <input id="option2" type="checkbox" name="option2" value="option2"> <label for="option2">css</label> <br>
         <input id="option3" type="checkbox" name="option3" value="option3" checked> <label for="option3">javascript</label> <br>
        <!-- radio -->
         <input id="male" type="radio" name="option" value="option1" checked> <label for="male">male</label> <br>
         <input id="female" type="radio" name="option" value="option2"> <label for="female">female</label> <br>
         <!-- dropdown -->
          countery:
         <select name="country"  tabindex="1">
             <option value="usa" >USA</option>
             <option value="canada">Canada</option>
             <option value="uk" selected>UK</option>
         </select> <br>
         <!-- file -->
          <input type="file" name="file"> <br>
          <!-- fieldset -->
          <fieldset>
              <legend>Personal Information</legend>
              <p>Name: <input type="text" name="fullname" size="10" maxlength="5" placeholder="enter your name"></p>
              <p>Password: <input type="password" name="password"></p>
          </fieldset>
          <!-- access key -->
           <input type="checkbox" accesskey="a" >     <label> i aggree</label>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <input type="image" src="./images/crs1.jpg" name="image"
width="20" height="20">
<br>
<br>
<br>
          <!-- new features -->
           <input type="email" pattern="[A-Za-z]{3,15}">
           <input type="number" min="0" max="100" step="10">
           <input type="search">
           <input type="date">
           <input type="time">
           <input type="datetime-local">
           <input type="color">
           <input type="range">
           <input type="url">
           <input type="tel">
           <!-- datelist -->
            <input list="skills">
            <datalist id="skills">
                <option value="html">
                <option value="css">
                <option value="javascript">
            </datalist>
    </form>
</body>
</html>
