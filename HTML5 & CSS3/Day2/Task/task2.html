<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoLocation Map</title>
    <style>
      #map {
        height: 400px;
        width: 100%;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div>
      <h2>GeoLocation</h2>
      <button onclick="initMap()">Get My Location</button>
      <p id="Coordinates"></p>
    </div>

    <div id="map"></div>

    <script src="app.js"></script>

    <script
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap&v=weekly&loading=async"
      async
      defer
    ></script>
  </body>
</html>
