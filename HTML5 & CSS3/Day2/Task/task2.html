<!DOCTYPE html>
<html>
  <head>
    <title>User Location Map</title>
    <style>
      #map {
        height: 100vh;
        width: 100%;
      }
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      function initMap() {
        // Default coordinates while waiting for geolocation
        const defaultCenter = { lat: 0, lng: 0 };

        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 15,
          center: defaultCenter,
        });

        // Request user's position using Browser Geolocation API
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };

              // Recenter map on user location
              map.setCenter(userLocation);

              // Add a simple marker at the user location
              new google.maps.Marker({
                position: userLocation,
                map: map,
                title: "You are here",
              });
            },
            () => {
              handleLocationError(true);
            }
          );
        } else {
          // Browser doesn't support Geolocation
          handleLocationError(false);
        }
      }

      function handleLocationError(browserHasGeolocation) {
        alert(
          browserHasGeolocation
            ? "Error: Geolocation permission denied or failed."
            : "Error: Your browser does not support geolocation."
        );
      }
    </script>

    <!-- Replace YOUR_API_KEY with your actual Google Maps API Key -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"
      async
      defer
    ></script>
  </body>
</html>
