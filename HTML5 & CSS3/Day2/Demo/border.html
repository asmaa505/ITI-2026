<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #divRadius
    {
        /* border-bottom: 5px solid blue; */
        border: 5px solid blue;
        text-align: center;
        width: 500px;
    }
    #divRadius2
    {
        width: 100px;
        height: 100px;
        border: 5px solid blue;
        text-align: center;
        /* border-top-left-radius: 10px; */
        border-radius: 10px 30px;
        
    }
    #divShadow
    {
        text-align: center;
        width: 500px;
        border: 5px solid blue;
        /* box-shadow: 5px 10px; */
        /* box-shadow: 5px 10px lightblue; */
        box-shadow: 5px 10px 10px;
        box-shadow: 5px 10px 10px 10px;
    
    }
    #divBorderImage
    {
        text-align: center;
        width: 500px;
        border: 5px solid blue;
        padding: 15px;
        border-image-source: url(border.png);
        border-image-slice:30 ;
        border-image-repeat: round;

    }
</style>
<body>
    <div id="divRadius">
     Div Radius
    </div>
    <br>
    <br>
    <div id="divRadius2">
     Div Radius2
    </div>
    <br> <br>
    <div id="divRadius3">
     Div Radius3
    </div>

    <div id="divShadow">
    Div Shadow
    </div>
    <br> <br>

    <div id="divBorderImage">
        divBorderImage
    </div>
</body> 
</html>
