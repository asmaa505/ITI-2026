<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <!-- 1 -->
        <h2>Registration Form</h2>
        <form action="#" method="POST">
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required placeholder="Enter username"><br><br>
    
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="Enter email"><br><br>
    
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="6"><br><br>
    
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" min="18" max="100"><br><br>
    
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob"><br><br>
    
            <label for="color">Favorite Color:</label><br>
            <input type="color" id="color" name="color"><br><br>
    
            <label for="range">Satisfaction Level:</label><br>
            <input type="range" id="range" name="range" min="0" max="100"><br><br>
    
            <input type="submit" value="Register">
        </form>
</body>
</html>
