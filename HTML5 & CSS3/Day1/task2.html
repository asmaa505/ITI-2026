<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 2 -->
    <div class="player-container">
        <div class="top-section">
            <img src="mario.jpg" alt="Super Mario" class="cover-img">
            <div class="controls">
                <input type="range" min="0" max="100" value="20">
                <div class="button-group">
                    <div>
                        <button>play</button>
                        <button>pause</button>
                        <button>stop</button>
                    </div>
                    <input type="range" min="0" max="100" value="80">
                </div>
            </div>
        </div>

        <ul class="playlist">
            <li>Super Mario</li>
            <li>Lose you to find me</li>
            <li>Bad Guy</li>
            <li>Mel Bedaya</li>
        </ul>
    </div>
</body>
</html>
